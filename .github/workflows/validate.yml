# PR gate. Runs the same composite action as the main publish workflow, without secrets.
# Markdown-only and docs/** changes skip it, so most docs PRs show no check. The two docs that
# the gate freshness-checks (relay-tables.ts --check, world-report.ts --check) are re-included
# so a PR editing them still runs the gate. Later patterns win, so the re-includes come last.
name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/broken-relay.md"
      - "docs/world-realism.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
