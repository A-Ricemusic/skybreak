name: Publish to Roblox

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-roblox
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - uses: ok-nick/setup-aftman@v0.4.2

      - run: bun install --frozen-lockfile

      - name: Build place
        run: bun run build:place

      - name: Publish to Roblox
        if: ${{ vars.ROBLOX_UNIVERSE_ID != '' && vars.ROBLOX_PLACE_ID != '' && secrets.ROBLOX_API_KEY != '' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: tools/publish-place.sh

      - name: Publish skipped
        if: ${{ vars.ROBLOX_UNIVERSE_ID == '' || vars.ROBLOX_PLACE_ID == '' || secrets.ROBLOX_API_KEY == '' }}
        run: echo "::notice::Build passed. Set ROBLOX_API_KEY (secret) and ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID (variables) to publish."
