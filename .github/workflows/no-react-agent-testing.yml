name: No React agent testing

# Always runs (no paths filter) so docs/markdown-only PRs cannot re-add the
# intentionally removed react-agent-testing harness or a web React/DOM test stack.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Guard against react-agent-testing
        run: bun tools/check-no-react-agent-testing.ts
