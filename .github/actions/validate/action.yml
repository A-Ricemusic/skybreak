name: Validate SKYBREAK offline
description: Build the production place and validate compiled offline contracts without secrets or Studio.
runs:
  using: composite
  steps:
    # Toolchain pins match package.json (bun), aftman.toml (rojo) and README's validate prerequisites.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14
    - uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b # v0.4.2
      with:
        version: v0.3.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Install standalone validation dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes ffmpeg unzip
        mkdir -p build/offline-luau
        curl --fail --location --silent --show-error https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
        echo "6506f0852c623aaffcb28494aac16c26dc04a269ea0e16cc0aafc8c8ac79f3ec  $RUNNER_TEMP/luau.zip" | sha256sum --check
        unzip -o "$RUNNER_TEMP/luau.zip" -d build/offline-luau
        chmod +x build/offline-luau/luau
    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Build and validate offline
      shell: bash
      run: bun run validate:offline
